name: Android APK

# Builds a debug APK of the sample game (test/) for arm64 phones and
# uploads it as the "bird-android-debug" artifact of each run.
on:
  push:
    branches: [android-gles]
    paths:
      - "src/**"
      - "assets/**"
      - "test/**"
      - "android/**"
      - "CMakeLists.txt"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "src/**"
      - "assets/**"
      - "test/**"
      - "android/**"
      - "CMakeLists.txt"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    name: Debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Select NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Newest 3.x CMake the SDK repository offers (the root project
          # needs 3.23+), and the runner image's default (stable) NDK.
          CMAKE_VERSION=$("$SDKMANAGER" --list 2>/dev/null \
            | grep -oE 'cmake;3\.[0-9]+\.[0-9]+' | sed 's/cmake;//' \
            | sort -uV | tail -1)
          yes | "$SDKMANAGER" "cmake;${CMAKE_VERSION}" > /dev/null
          NDK_VERSION=$(basename "$ANDROID_NDK_HOME")
          echo "CMake ${CMAKE_VERSION}, NDK ${NDK_VERSION}"
          echo "CMAKE_VERSION=${CMAKE_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_VERSION=${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: >
          gradle assembleDebug --stacktrace
          -PbirdNdkVersion="${NDK_VERSION}"
          -PbirdCmakeVersion="${CMAKE_VERSION}"

      - name: Show APK contents
        run: |
          ls -la android/app/build/outputs/apk/debug/
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -E '\.so$|AndroidManifest|shaders/ui' 
          echo "Packaged .bird assets: $(unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -c '\.bird$')"

      - uses: actions/upload-artifact@v4
        with:
          name: bird-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  emulator:
    name: Emulator smoke test (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Select NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          CMAKE_VERSION=$("$SDKMANAGER" --list 2>/dev/null \
            | grep -oE 'cmake;3\.[0-9]+\.[0-9]+' | sed 's/cmake;//' \
            | sort -uV | tail -1)
          yes | "$SDKMANAGER" "cmake;${CMAKE_VERSION}" > /dev/null
          echo "CMAKE_VERSION=${CMAKE_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$(basename "$ANDROID_NDK_HOME")" >> "$GITHUB_ENV"

      - name: Build x86_64 APK
        working-directory: android
        run: >
          gradle assembleDebug
          -PbirdNdkVersion="${NDK_VERSION}"
          -PbirdCmakeVersion="${CMAKE_VERSION}"
          -PbirdAbis=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          # Guest-side rendering (ANGLE on SwiftShader): the host-side
          # translator miscounts uniform blocks against the default-block
          # uniform limit and rejects the light-volume shader, which phones
          # accept.
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./android/scripts/smoke-test.sh android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-test
          path: |
            logcat.txt
            screenshot.png
          if-no-files-found: ignore
