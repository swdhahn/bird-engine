name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish (e.g. v0.1.0). Leave blank for a build-only run with no release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxxf86vm-dev \
            libclang-dev llvm-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja llvm

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install -y ninja llvm

      - name: Set up MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Third-party dependencies are built from source via ExternalProject_Add
      # and rarely change, so cache the install prefix keyed on libs/CMakeLists.txt.
      - name: Cache third-party dependencies
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: libs/install
          key: ${{ runner.os }}-${{ runner.arch }}-libs-${{ hashFiles('libs/CMakeLists.txt') }}

      - name: Configure third-party dependencies
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: cmake -S libs -B libs -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build third-party dependencies
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: cmake --build libs

      - name: Configure engine
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build engine
        run: cmake --build build

      - name: Bake engine assets
        run: ./build/BuildTools

      - name: Install engine (stage release contents)
        run: cmake --install build --prefix stage

      - name: Package release archive
        run: |
          cd stage
          ARCHIVE="../bird-engine-${{ matrix.name }}.zip"
          7z a -tzip "$ARCHIVE" . > /dev/null || zip -r "$ARCHIVE" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bird-engine-${{ matrix.name }}
          path: bird-engine-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || inputs.version != ''
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          draft: true
          generate_release_notes: true
          files: artifacts/*.zip
